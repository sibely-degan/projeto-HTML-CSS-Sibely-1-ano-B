<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Marinha | Explorando os Oceanos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f0f8ff;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Navegação */
        nav {
            background-color: #023e8a;
            padding: 12px 0;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #90e0ef;
        }

        /* Conteúdo principal */
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: white;
            margin-bottom: 30px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        section h2 {
            color: #0077b6;
            margin-bottom: 15px;
            font-size: 1.8rem;
            border-bottom: 3px solid #90e0ef;
            padding-bottom: 8px;
        }

        section p {
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        /* Cards de animais */
        .animais {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #e8f4f8;
            border-radius: 10px;
            padding: 20px;
            flex: 1 1 250px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,119,182,0.2);
        }

        .card h3 {
            color: #023e8a;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 0.95rem;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Lista */
        ul {
            margin-left: 25px;
            margin-top: 10px;
        }

        ul li {
            margin-bottom: 8px;
        }

        /* Footer */
        footer {
            background-color: #023e8a;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        footer p {
            font-size: 0.95rem;
        }
